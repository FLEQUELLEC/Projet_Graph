name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"] 

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Installe les dépendances listées dans requirements.txt s'il existe
        # Sinon, installe pandas et polars par défaut (nécessaire pour ton projet)
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt
        else 
          pip install pandas polars
        fi

    - name: Analysing the code with pylint
      run: |
        # Lance pylint sur tous les fichiers .py suivis par git.
        # --disable=C,R,W : Ignore les conventions (style), refactoring et warnings.
        # On ne garde que les Erreurs (E) et Fatals (F).
        pylint --disable=C,R,W $(git ls-files '*.py')
